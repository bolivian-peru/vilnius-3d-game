<!doctype html><html><head><meta charset="utf-8"><title>tree lab</title><style>body{margin:0;background:#b9cfe6}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { Trees } from '/src/trees.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9cfe6);
scene.fog = new THREE.FogExp2(0xb9cfe6, 3.3e-4);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x6a6458, 1.2));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.4); sun.position.set(-200, 400, 150); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshBasicMaterial({ color: 0x5a5c40, toneMapped: false }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const trees = new Trees(scene, renderer, {});
await trees.init;
const dist = (q.get('rows') || '22,100,300').split(',').map(Number), H = +(q.get('h') || 16);
const t = { name: 'lab', ix: 0, iy: 0, trees: [], meshes: [], cells: new Map(), data: [] };
trees.tiles.set('lab', t);
dist.forEach((d, row) => trees.variants.forEach((v, i) => {
  const spread = d * 0.11;
  t.trees.push({ x: (i - 3.5) * Math.max(spread, H * 0.8), y: 0, z: -d, h: v.def.type ? H * 1.2 : H, width: 1, rot: i * 1.3 + row, v: i, tint: new THREE.Color(v.def.leaf).convertSRGBToLinear ? new THREE.Color(v.def.leaf) : null, cb: 3, trunk: 0.3 });
}));
for (const tr of t.trees) tr.tint = new THREE.Color(trees.variants[tr.v].def.leaf).multiplyScalar(1.0);
trees.buildChunks(t);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.25, 2600);
camera.position.set(0, +(q.get('cy') || 1.7), 0);
camera.lookAt(0, +(q.get('ly') || 6), -60);
camera.updateMatrixWorld();
renderer.setAnimationLoop(() => { trees.update(camera, performance.now() / 1000); renderer.render(scene, camera); });
window.__lab = { trees, camera, renderer, scene };
</script></body></html>
