[project]
name = "vilnius-pipeline"
version = "0.1.0"
description = "Geographic data pipeline for the Vilnius open-world game"
requires-python = ">=3.12"
dependencies = [
    "pyproj>=3.6",
    "shapely>=2.0",
    "osmium>=4.0",
    "numpy>=2.0",
    "requests>=2.32",
    "DracoPy>=1.4",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "scikit-image>=0.26.0",
]

[project.scripts]
vilnius = "vilnius_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vilnius_pipeline"]
